name: My First Github Action
on:
  push:
   branches: [main]
jobs:
  hello:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect Runner
        run: |
          pwd
          ls
          python --version

      - name: Say hello
        run: echo "Hello from Github Actions"